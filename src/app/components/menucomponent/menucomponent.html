<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-72 bg-[#0a1128] text-white flex flex-col justify-between h-full shadow-2xl z-20">
    <div class="p-8 flex flex-col items-center border-b border-gray-800">
      <div class="relative mb-4">
        <!-- Uso de Signal: userName() -->
        <div
          class="w-24 h-24 rounded-full bg-yellow-500 flex items-center justify-center text-3xl font-bold text-[#0a1128] border-4 border-[#1c2541] shadow-lg">
          {{ userName().charAt(0) }}
        </div>
      </div>
      <!-- Uso de Signals -->
      <h3 class="font-semibold text-lg text-center leading-tight mb-1">{{ userName() }}</h3>
      <p class="text-xs text-gray-400 mb-3 truncate w-full text-center">{{ userEmail() }}</p>

      <span class="bg-blue-900/50 text-blue-300 text-xs px-4 py-1 rounded-full border border-blue-800">
        {{ isAdmin() ? 'Administrador' : 'Usuario' }}
      </span>
    </div>

    <!-- Navegación -->

    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">

      <a routerLink="/menu/homes" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
          </path>
        </svg>
        Inicio
      </a>

      <a routerLink="/menu/ejercicios" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
        </svg>
        Ejercicios
      </a>

      <a routerLink="/menu/noticias" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15M9 11l3 3L22 4">
          </path>
        </svg>
        Noticias
      </a>

      <!-- Solo USUARIO -->
      @if (!isAdmin()) {
      <a routerLink="/menu/perfil" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        Perfil
      </a>
      }

      <!-- Solo ADMIN -->
      @if (isAdmin()) {
      <a routerLink="/menu/grupo-muscular" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        Grupo Muscular
      </a>

      <a routerLink="/menu/usuarios" routerLinkActive="bg-yellow-500 text-black font-bold shadow-md"
        class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-8a4 4 0 11-8 0 4 4 0 018 0zm6 3a4 4 0 11-8 0 4 4 0 018 0z">
          </path>
        </svg>
        Control de Usuarios
      </a>
      }

    </nav>

    <!-- Botón Inferior -->
    <div class="p-6 border-t border-gray-800">
      <button (click)="logout()"
        class="w-full flex items-center justify-center gap-2 border border-gray-600 text-gray-300 hover:bg-yellow-500 hover:text-black hover:border-yellow-500 py-3 rounded-xl transition-all font-semibold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 overflow-y-auto bg-slate-50 relative">
    <router-outlet></router-outlet>
  </main>
</div>
