<div class="p-8 max-w-7xl mx-auto font-sans">
  
  <header class="flex flex-col md:flex-row md:justify-between md:items-center mb-8 gap-4">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
        <!-- SVG Icon -->
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
        Gestión de Rutinas
      </h1>
      <p class="text-gray-500 text-sm mt-1">Administra todas las rutinas registradas en el sistema.</p>
    </div>
    
    <button *ngIf="isAdmin" (click)="abrirModalNuevaRutina()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2.5 px-6 rounded-lg shadow transition-colors flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Añadir Rutina
    </button>
  </header>

  <!-- Spinner de carga -->
  <div *ngIf="cargando" class="flex justify-center items-center py-20">
    <svg class="animate-spin h-10 w-10 text-yellow-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </div>

  <!-- Tabla Administrativa Tailwind -->
  <div *ngIf="!cargando" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-4 font-semibold text-gray-600 uppercase tracking-wider">ID</th>
            <th class="px-6 py-4 font-semibold text-gray-600 uppercase tracking-wider">Nombre de Rutina</th>
            <th class="px-6 py-4 font-semibold text-gray-600 uppercase tracking-wider">Descripción</th>
            <th class="px-6 py-4 font-semibold text-gray-600 uppercase tracking-wider">Fecha Creación</th>
            <th class="px-6 py-4 font-semibold text-gray-600 uppercase tracking-wider text-right">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
          <tr *ngFor="let rut of rutinas" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap text-gray-500 font-medium">#{{ rut.idrutina }}</td>
            <td class="px-6 py-4 font-bold text-gray-800">{{ rut.nombre }}</td>
            <td class="px-6 py-4 text-gray-600 max-w-xs truncate" [title]="rut.descripcion">{{ rut.descripcion }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ rut.fechaCreacion }}</td>
            
            <td class="px-6 py-4 whitespace-nowrap text-right">
              <div class="flex justify-end gap-2">
                <button class="p-2 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors" title="Editar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>
                <button (click)="eliminarRutina(rut.idrutina)" class="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors" title="Eliminar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            </td>
          </tr>
          
          <!-- Fila vacía si no hay datos -->
          <tr *ngIf="rutinas.length === 0">
            <td colspan="5" class="px-6 py-10 text-center text-gray-500">
              No hay rutinas registradas en la base de datos.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- El MODAL de Crear se mantiene igual, solo cambia <mat-icon>close</mat-icon> por un SVG -->
  <div *ngIf="mostrarModal" class="fixed inset-0 z-50 flex items-center justify-center overflow-auto bg-black bg-opacity-50 backdrop-blur-sm">
    <!-- ... Contenido del modal anterior ... -->
    <button (click)="cerrarModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
       <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <!-- ... Resto del form ... -->
  </div>

</div>
